<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Football Factory</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f4;
        color: #172016;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(720px, 100%);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.5rem, 7vw, 5rem);
        line-height: 0.95;
      }

      p {
        max-width: 58ch;
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status::before {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #38b000;
        content: "";
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #101510;
          color: #edf5e8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Vercel staging ready</div>
      <h1>Football Factory</h1>
      <p>
        The repository now has a deployable static entry point on the main branch.
        The full Football Factory experience can be added here when it is ready.
      </p>
    </main>
  </body>
</html>
